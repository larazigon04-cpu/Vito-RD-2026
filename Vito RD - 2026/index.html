<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday cake</title>
    <link rel="stylesheet" href="style.css  " />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div id="birthdayText"></div>
        <div class="cake-container">
            <div class="cake" id="cake"></div>
        </div>
    </div>
    <div id="youtube" style="position:absolute; left:-9999px;"></div>

    <script>
        let yt;
function onYouTubeIframeAPIReady() {
    yt = new YT.Player("youtube", {
        videoId: "VClI7NywlYA",
        width: 200,
        height: 200,
        playerVars: { start: 1 }
    });
}
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name") || "Vito ❤️";

        let candleCount = parseInt(params.get("candles")) || 4;
        candleCount = Math.min(Math.max(candleCount, 1), 30);

        const birthdayText = document.getElementById("birthdayText");
        birthdayText.innerHTML = `
            <div id="mainTitle"> Vse naj naj, ${name}!</div>
            <div id="subTitle"> Zaželi si nekaj in upihni svečke.</div>
        `;

        const cake = document.getElementById("cake");

        // candle colors
        const colors = [
            "green-candle",
            "purple-candle",
            "blue-candle",
            "yellow-candle",
        ];


const CAKE_VISUAL_WIDTH = 35
// ===== SVEČKE NA TORTI =====
function createCandles(count) {
    cake.innerHTML = "";

    // zgornja ploskev tvoje torte
    const TOP_LEFT = 90;
    const TOP_RIGHT = 230;
    const FIRST_ROW_Y = 157;
    const ROW_GAP = 5;

    // sredina in dno svečke pri scale(0.5)
    const CANDLE_CENTER_X = 22.5;
    const CANDLE_BOTTOM_Y = 46.25;

    const candlesPerRow = 7;
    const rowShift = 8;

    for (let i = 0; i < count; i++) {
        const candle = document.createElement("div");
        candle.classList.add("candle");
        candle.classList.add(colors[Math.floor(Math.random() * colors.length)]);

        const row = Math.floor(i / candlesPerRow);
        const col = i % candlesPerRow;
        const inThisRow = Math.min(candlesPerRow, count - row * candlesPerRow);

        const spacing = (TOP_RIGHT - TOP_LEFT) / (inThisRow + 1);
        const centerX = TOP_LEFT + spacing * (col + 1) + (row % 2 ? rowShift : 0);
        const bottomY = FIRST_ROW_Y + row * ROW_GAP;

        candle.style.position = "absolute";
        candle.style.left = `${centerX - CANDLE_CENTER_X}px`;
        candle.style.top = `${bottomY - CANDLE_BOTTOM_Y}px`;

        cake.appendChild(candle);
    }
}

createCandles(candleCount);

// ===== UPIHOVANJE =====
let blown = false;

function blowOutCandles() {
    if (blown) return;
    blown = true;

    document.querySelectorAll(".candle").forEach((candle) => {
        const delay = Math.random() * 1000;
        setTimeout(() => candle.classList.add("blown"), delay);
    });

    setTimeout(() => {
        document.getElementById("subTitle").textContent = "Želim ti vse najboljše in rada te imam!!!💕";
        if (yt) yt.playVideo();
    }, 1200);
}

async function startMicDetection() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        const data = new Uint8Array(analyser.frequencyBinCount);

        const VOLUME_THRESHOLD = 60; // višje = treba močneje pihniti
        const FRAMES_NEEDED = 10;    // koliko sličic zapored mora biti glasno
        let loudFrames = 0;

        function detectBlow() {
            analyser.getByteFrequencyData(data);

            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const volume = sum / data.length;

            loudFrames = volume > VOLUME_THRESHOLD ? loudFrames + 1 : 0;

            if (loudFrames >= FRAMES_NEEDED) {
                blowOutCandles();
                return;
            }
            requestAnimationFrame(detectBlow);
        }

        detectBlow();
    } catch (err) {
        console.error("Mic access error: ", err);
    }
}

// brskalnik dovoli zvok šele po kliku, zato mikrofon vklopimo ob prvem kliku
document.addEventListener("click", startMicDetection, { once: true });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
